[package]
name = "vesk"
version = "0.1.0"
description = "Shell nativo en Rust para Discord con Vencord inyectado"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
  "common-controls-v6",
  "compression",
  "dbus",
  "devtools",
  "dynamic-acl",
  "image-png",
  "tray-icon",
  "x11",
] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
open = "5"
rusqlite = "0.32"
pipewire = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"], optional = true }
cef = { version = "=150.2.1", optional = true }
tauri-runtime-cef = { git = "https://github.com/SableClient/tauri-runtime-cef", rev = "2e43e05f5f0cbc9b19a4dbb2318e95b0e9d43c2e", features = ["devtools"], optional = true }
winit = { version = "=0.31.0-beta.2", optional = true }

[features]
default = ["cef"]
cef = ["dep:tauri-runtime-cef", "dep:cef", "dep:gtk", "dep:winit"]
wry = ["tauri/wry"]
